<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — KOLPOCRAFT</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1100px;margin:35px auto}.panel{background:var(--paper);border:1px solid var(--line);padding:22px;border-radius:16px;margin:15px 0}.admin input,.admin select{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--green)}.login{max-width:430px;margin:60px auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{min-width:125px}</style></head><body><header class="site-header"><a class="brand" href="index.html">KOLPO<span>CRAFT</span></a><div class="header-actions"><a class="btn small" href="index.html">Storefront</a></div></header><main class="wrap admin"><h1>Admin Dashboard</h1><section class="panel login" id="login"><h2>Admin Login</h2><p class="muted">আপনার ADMIN_PASSWORD দিন।</p><input id="password" type="password" placeholder="Admin password" style="width:100%;margin:10px 0"><button class="btn" id="loginBtn">Login</button><p id="loginMsg" class="muted"></p></section><section id="dashboard" hidden><div class="panel row"><b>অর্ডার ম্যানেজমেন্ট</b><button class="btn small" id="refresh">Refresh</button><button class="btn small outline" id="logout">Logout</button><span id="summary" class="muted"></span></div><div class="panel table-wrap"><table><thead><tr><th>তারিখ</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>Total</th><th>Address</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></section></main><script>
let secret="";const login=document.querySelector("#login"),dash=document.querySelector("#dashboard"),msg=document.querySelector("#loginMsg");
async function load(){const r=await fetch("/api/admin/orders",{headers:{Authorization:"Bearer "+secret}});if(!r.ok){msg.textContent="Login failed বা API সেটআপ হয়নি।";return}const d=await r.json();login.hidden=true;dash.hidden=false;document.querySelector("#summary").textContent=d.orders.length+" orders";document.querySelector("#orders").innerHTML=d.orders.map(o=>`<tr><td>${new Date(o.created_at+"Z").toLocaleString()}</td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}</td><td>${esc(o.product_name)}<br>${esc(o.variant)}</td><td>${o.quantity}</td><td>৳${o.total_price}</td><td>${esc(o.address)}</td><td><select class="status" data-id="${o.id}">${["New","Confirmed","Processing","Shipped","Completed","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("");document.querySelectorAll(".status").forEach(s=>s.onchange=async()=>{await fetch("/api/admin/orders",{method:"PATCH",headers:{Authorization:"Bearer "+secret,"Content-Type":"application/json"},body:JSON.stringify({id:s.dataset.id,status:s.value})})})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.querySelector("#loginBtn").onclick=()=>{secret=document.querySelector("#password").value;load()};document.querySelector("#refresh").onclick=load;document.querySelector("#logout").onclick=()=>{secret="";dash.hidden=true;login.hidden=false;document.querySelector("#password").value=""};
</script></body></html>
